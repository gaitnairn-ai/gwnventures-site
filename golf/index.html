<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Fescue Club moved to its own domain on 2026-07-30.
  The meta refresh here is DELIBERATE and must stay. GitHub Pages cannot issue a
  real 301, and an instant refresh plus the canonical below is how search engines
  are told to fold this URL into https://fescueclub.com/.
  This is the opposite of the 404 page, where a refresh was removed because
  nothing there should look like a redirect. Do not "fix" this one.
  Leave it indexable: noindex would stop the signal transferring.
-->
<meta http-equiv="refresh" content="0; url=https://fescueclub.com/">
<link rel="canonical" href="https://fescueclub.com/">
<title>Fescue Club has moved to fescueclub.com</title>
<meta name="description" content="Fescue Club, the indoor golf club on real grass in New York City, now lives at fescueclub.com.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
  :root{ --dark:#16211a; --cream:#f2f1e8; }
  body{
    margin:0; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; padding:40px 24px; text-align:center;
    background:var(--dark); color:var(--cream);
    font-family:'Archivo',system-ui,sans-serif;
  }
  .mark{
    font-family:'Cormorant Garamond',serif; font-weight:600;
    font-size:15px; letter-spacing:.42em; text-transform:uppercase; opacity:.72;
  }
  p{ margin:0; font-size:17px; line-height:1.6; max-width:36ch; }
  a{ color:var(--cream); }
</style>
</head>
<body>
  <div class="mark">Fescue Club</div>
  <p>Fescue Club has a new home at <a href="https://fescueclub.com/">fescueclub.com</a>.</p>
  <script>location.replace("https://fescueclub.com/");</script>
</body>
</html>
